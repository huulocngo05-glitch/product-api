services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb-prod
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data_prod:/data/db

  product-api:
    image: huulocz/product-api:latest
    container_name: product-api-prod
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      - mongodb

volumes:
  mongodb_data_prod: