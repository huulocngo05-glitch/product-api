name: CD - Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t huulocz/product-api:latest .

      - name: Run MongoDB
        run: |
          docker run -d \
            --name nammongodb \
            -p 27017:27017 \
            mongo:latest

      - name: Run Product API
        run: |
          docker run -d \
            --name product-api \
            -p 3000:3000 \
            --link nammongodb:mongodb \
            -e PORT=3000 \
            -e MONGO_URI=mongodb://mongodb:27017/productdb \
            huulocz/product-api:latest

      - name: Healthcheck Product API
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              echo "Healthcheck passed"
              exit 0
            fi
            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Healthcheck failed"
          docker logs product-api
          exit 1

      - name: Push Docker image
        run: |
          docker push huulocz/product-api:latest