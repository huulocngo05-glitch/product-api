name: Deploy to Local Docker

on:
  workflow_run:
    workflows: ["CD - Docker Hub"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull and restart containers
        shell: cmd
        run: |
          docker compose -f docker-compose-prod.yaml pull
          if errorlevel 1 exit /b 1
          docker compose -f docker-compose-prod.yaml up -d --force-recreate
          if errorlevel 1 exit /b 1

      - name: Check API health
        shell: cmd
        run: |
          curl.exe --fail --silent --show-error --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors --max-time 5 http://localhost:3002/health
          if errorlevel 1 (
            docker compose -f docker-compose-prod.yaml ps
            docker compose -f docker-compose-prod.yaml logs --tail 100 product-api
            exit /b 1
          )